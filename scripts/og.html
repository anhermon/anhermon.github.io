<!DOCTYPE html>
<!-- OG card template. Render at 1200x630 from the repo root server: headless Chrome screenshot of /scripts/og.html -> /og.png -->
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>OG card</title><link rel="stylesheet" href="/assets/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#08090A url(/scripts/og-bg.webp) 0 0/1200px 630px no-repeat;padding:56px 64px;display:flex;flex-direction:column}
.k{font-size:20px;font-weight:600;letter-spacing:-.012em;display:flex;justify-content:space-between}
.k span+span{font-weight:400;color:var(--dim)}
h1{margin-top:auto;font-size:76px;max-width:10em}
h1 .tr{color:#fff}
.sub{margin-top:20px;font-size:26px;line-height:1.35;color:var(--dim);letter-spacing:-.017em}
</style></head><body>
<div class="k"><span>Angel Hermon</span><span>anhermon.dev</span></div>
<h1>Agents that fail should leave a <span class="tr">trace</span>.</h1>
<p class="sub">Observable, deterministic AI agent pipelines.</p>
</body></html>
