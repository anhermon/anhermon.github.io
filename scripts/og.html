<!DOCTYPE html>
<!-- OG card template. Render at 1200x630 from the repo root server: headless Chrome screenshot of /scripts/og.html -> /og.png -->
<html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>OG card</title><link rel="stylesheet" href="/assets/site.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body::after{display:none}
body{background:#07080A url(/scripts/og-bg.webp) 0 0/1200px 630px no-repeat;padding:58px 64px;display:flex;flex-direction:column}
.k{font:500 15px var(--mono);color:var(--dim);display:flex;gap:18px}
h1{margin-top:auto;font-size:112px;max-width:6.4em;font-weight:260;font-stretch:76%}
h1 .tr{font-weight:800;font-stretch:100%}
.sub{margin-top:26px;font:380 25px/1.3 var(--sans);color:var(--dim)}
</style></head><body>
<div class="k"><span style="color:var(--bone)">Angel Hermon</span><span>anhermon.dev</span></div>
<h1>Agents that fail should leave a <span class="tr">trace</span>.</h1>
<p class="sub">Observable, deterministic AI agent pipelines.</p>
</body></html>
